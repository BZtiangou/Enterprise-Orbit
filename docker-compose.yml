version: '3.8'
services:
  enterprise-orbit-db:
    image: postgres:14
    container_name: enterprise-orbit-postgres
    environment:
      POSTGRES_DB: enterprise_orbit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-orbit-network

  enterprise-orbit-redis:
    image: redis:7-alpine
    container_name: enterprise-orbit-redis
    ports:
      - "6379:6379"
    networks:
      - enterprise-orbit-network

volumes:
  postgres_data:

networks:
  enterprise-orbit-network:
    driver: bridge